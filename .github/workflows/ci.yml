name: macOS build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Verify DSP and imports
        run: ./Tests/verify.sh
      - name: Check C++/Objective-C++ formatting
        run: xcrun clang-format --dry-run --Werror Sources/Audio/AudioBridge.mm Sources/DSP/DSP.cpp
      - name: Universal build (Intel slice compiles; not yet hardware-qualified)
        run: ARCHS="arm64 x86_64" ./build.sh && lipo -archs build.noindex/DeviceEQ.app/Contents/MacOS/DeviceEQ
